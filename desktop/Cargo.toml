[package]
name = "ledcast-console"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "LEDCAST Console: NDI to network LED lines"
license = "MIT"
build = "build.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
libloading = "0.9"
mdns-sd = "0.21"
open = "5"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
socket2 = "0.6"
hmac = "0.12"
sha2 = "0.10"
dns-lookup = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSObject"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = true
