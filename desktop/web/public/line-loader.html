<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>LEDCAST</title>
    <!-- Окно контроллера: страница строки идёт по Wi‑Fi, пока её нет — эта заставка в цветах контроллера. -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: rgb(13, 15, 19);
        color: rgb(150, 155, 165);
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .spinner {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-top-color: rgba(255, 255, 255, 0.7);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div class="spinner" aria-hidden="true"></div>
    <div id="text" role="status">Загружаем контроллер строки…</div>
    <script>
      const host = new URLSearchParams(location.search).get("host") ?? "";
      if (/^[A-Za-z0-9.\-]+(:\d+)?$/.test(host)) location.replace(`http://${host}/`);
      else document.getElementById("text").textContent = "Неверный адрес строки";
    </script>
  </body>
</html>
