name: Release

# Выпуск: поднять версию (scripts/check-version.sh покажет все места),
# закоммитить, поставить тег vX.Y.Z и отправить его. Остальное делает этот
# workflow: собирает прошивку и приложение, подписывает происхождение файлов,
# публикует релиз и обновляет страницу установки прошивки.

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          TAG: ${{ github.ref_name }}
        run: scripts/check-version.sh "$TAG"

  firmware:
    name: Firmware
    needs: verify
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5@sha256:00e94c6ff8bc1f7bd22b234ff43db3f3056cb33dedac6819df9fbedbcb5c6ebb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false  # релиз собирается без кэшей
      - name: Web UI dependencies
        run: npm ci
      - name: Build and package
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          firmware/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: firmware/dist/
          if-no-files-found: error

  macos:
    name: Desktop macOS
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false  # релиз собирается без кэшей
      - name: Web UI dependencies
        run: npm ci
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Package
        env:
          # Необязательно: без этих секретов приложение подписывается ad-hoc.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            password="$(uuidgen)"
            echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
              -A -t cert -f pkcs12 -k "$keychain"
            security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
            security list-keychains -d user -s "$keychain"
          fi
          desktop/package-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos
          path: |
            desktop/dist/*.zip
            desktop/dist/SHA256SUMS
          if-no-files-found: error

  windows:
    name: Desktop Windows
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false  # релиз собирается без кэшей
      - name: Web UI dependencies
        run: npm ci
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: NDI runtime
        shell: pwsh
        timeout-minutes: 15
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "ndi-sdk.exe"
          Invoke-WebRequest "https://downloads.ndi.tv/SDK/NDI_SDK/NDI%206%20SDK.exe" -OutFile $installer
          # -Wait ждёт и дочерние процессы, которые установщик оставляет после себя; ждём только его
          $setup = Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -PassThru
          if (-not $setup.WaitForExit(600000)) { throw "NDI SDK installer did not finish in 10 minutes" }
          $dll = Get-ChildItem "C:\Program Files\NDI" -Recurse -Filter "Processing.NDI.Lib.x64.dll" |
            Select-Object -First 1
          if (-not $dll) { throw "Processing.NDI.Lib.x64.dll not found after NDI SDK install" }
          "NDI_RUNTIME_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Package
        shell: pwsh
        run: desktop/package-windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows
          path: |
            desktop/dist/*.zip
            desktop/dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [firmware, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # создать релиз и загрузить файлы
      id-token: write      # OIDC-токен для подписи аттестации
      attestations: write  # сохранить аттестацию происхождения
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Collect release files
        run: |
          mkdir release
          cp artifacts/firmware/*.bin artifacts/desktop-*/*.zip release/
          cat artifacts/*/SHA256SUMS > release/SHA256SUMS
          (cd release && sha256sum --check SHA256SUMS)
      # Аттестации и GitHub Pages на бесплатном плане есть только у публичных
      # репозиториев: в приватном релиз выходит без них.
      - name: Build provenance attestation
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --verify-tag --generate-notes \
            --title "LEDCAST $TAG" release/*
          gh release edit "$TAG" --draft=false

  installer:
    name: Web installer
    needs: publish
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write     # опубликовать страницу установки
      id-token: write  # OIDC-токен для deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware
          path: site
      - name: Assemble site
        run: cp firmware/installer/index.html firmware/installer/tokens.css site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
